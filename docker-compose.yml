services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      SUPABASE_INTERNAL_URL: http://host.docker.internal:55421
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "chmod +x scripts/wait-for-supabase.sh &&
      scripts/wait-for-supabase.sh http://host.docker.internal:55421 &&
      npm run dev"
